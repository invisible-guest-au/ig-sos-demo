<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sense Of Self - Share Your Experience</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #E8E6E3;
            --surface: #F5F4F2;
            --text: #181513;
            --muted: #6E6862;
            --border: #C8C3BE;
            --primary: #593327;
            --secondary: #778988;
            --focus: #CEB29F;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        
        h1, h2, .serif {
            font-family: 'Cormorant Garamond', Georgia, serif;
        }
        
        .container {
            text-align: center;
            max-width: 400px;
        }
        
        .logo {
            margin-bottom: 40px;
        }
        
        .logo img {
            height: 50px;
            width: auto;
        }
        
        .card {
            background: var(--surface);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 4px 24px rgba(24, 21, 19, 0.08);
        }
        
        .title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.75rem;
            font-weight: 500;
            color: var(--text);
            margin-bottom: 8px;
            line-height: 1.3;
        }
        
        .subtitle {
            font-size: 0.95rem;
            color: var(--muted);
            margin-bottom: 32px;
        }
        
        .qr-wrapper {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            display: inline-block;
            margin-bottom: 32px;
            box-shadow: 0 2px 12px rgba(24, 21, 19, 0.06);
        }
        
        .qr-wrapper img {
            display: block;
            width: 200px;
            height: 200px;
        }
        
        .instruction {
            font-size: 0.9rem;
            color: var(--muted);
            margin-bottom: 24px;
        }
        
        .instruction strong {
            color: var(--text);
        }
        
        .divider {
            width: 60px;
            height: 2px;
            background: var(--border);
            margin: 0 auto 24px;
        }
        
        .tagline {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.1rem;
            color: var(--muted);
            letter-spacing: 0.02em;
        }
        
        .frank-logo {
            position: fixed;
            bottom: 20px;
            left: 20px;
            opacity: 0.6;
        }
        
        .frank-logo img {
            height: 18px;
            width: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="./assets/Sense_Of_Self.png" alt="Sense Of Self">
        </div>
        
        <div class="card">
            <h1 class="title">How was your soak?</h1>
            <p class="subtitle">We'd love to hear about your experience</p>
            
            <div class="qr-wrapper">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://invisible-guest-au.github.io/ig-sos-demo/" alt="Scan to share feedback">
            </div>
            
            <p class="instruction">
                <strong>Scan the QR code</strong> with your phone camera<br>
                to share your feedback
            </p>
            
            <div class="divider"></div>
            
            <p class="tagline">Come as you are. Take what you need.</p>
        </div>
    </div>
    
    <a href="https://invisibleguest.com.au" target="_blank" rel="noopener" class="frank-logo">
        <img src="./assets/Frank_Custom.png" alt="Frank">
    </a>
</body>
</html>
